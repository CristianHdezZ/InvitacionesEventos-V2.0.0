<!-- ===================== PORTADA / SOBRE ===================== -->
<div class="gate" id="gate">
  <div id="gateParticles" class="gate__particles" aria-hidden="true"></div>

  <!-- Fila 1 del grid de .gate (auto 1fr auto auto). Las capas
       decorativas de arriba —partículas, mariposas, lottie— van
       en position:absolute, así que no ocupan celda. -->
  <div class="gate__top">
  <img class="garland garland--top garland-img" id="gateFloralTopImg" src="" alt="" hidden>

       arriba solo se muestra cuando el admin sube una imagen propia, y
       entonces esta se oculta. En V1 pasaba al revés: el SVG nacía con
       display:none y scriptOld.js lo destapaba, así que al retirar ese
       archivo la portada se quedó sin decoración. -->

  <!-- Animación Lottie decorativa (brillos/corazones flotando). Si no carga
       (por ejemplo sin conexión), simplemente no se ve nada — no rompe el
       diseño. Puedes cambiar el src por cualquier animación gratuita de
       https://lottiefiles.com (botón "Embed" → copia la URL .json/.lottie). -->
  <lottie-player
    id="gateLottie"
    class="gate__lottie"
    src="assets/flor.json"
    background="transparent" speed="0.6" loop autoplay>
  </lottie-player>

  <div class="gate__content">
    <p class="gate__eyebrow">Con la bendición de Dios y mi familia</p>
    <svg class="gate__crown" id="gateCoronaSvg" viewBox="0 0 100 60" aria-hidden="true">
      <path d="M10,50 L10,30 L25,42 L35,15 L50,35 L65,15 L75,42 L90,30 L90,50 Z" fill="none" stroke="var(--color-gold, var(--oro, #B8935C))" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="35" cy="15" r="4" fill="var(--color-gold, var(--oro, #B8935C))"/>
      <circle cx="50" cy="10" r="5" fill="var(--color-primary-dark, var(--rosa-deep, #C97D95))"/>
      <circle cx="65" cy="15" r="4" fill="var(--color-gold, var(--oro, #B8935C))"/>
      <line x1="15" y1="50" x2="85" y2="50" stroke="var(--color-gold, var(--oro, #B8935C))" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <img class="gate__crown gate__crown--img" id="gateCoronaImg" src="" alt="" hidden>
    <h1 class="gate__name">Linda</h1>
    <p class="gate__xv">XV AÑOS</p>
    <p class="gate__quote">
      Hay momentos inolvidables que se atesoran en el corazón para siempre.
      Me siento muy feliz de llegar a este momento de mi vida y quiero
      compartirlo contigo.
    </p>
    <button class="gate__envelope" id="gateBtn" type="button" aria-label="Abrir invitación">
      <svg class="gate__envelope-body" viewBox="0 0 220 130" aria-hidden="true">
        <rect x="3" y="3" width="214" height="124" rx="14" class="gate__envelope-paper"/>
        <rect x="9" y="9" width="202" height="112" rx="9" class="gate__envelope-inner"/>
        <path d="M3,17 L110,88 L217,17" class="gate__envelope-flap"/>
        <path d="M9,17 L110,80 L211,17" class="gate__envelope-flap gate__envelope-flap--inner"/>
        <circle cx="16" cy="16" r="1.4" class="gate__envelope-dot"/>
        <circle cx="204" cy="16" r="1.4" class="gate__envelope-dot"/>
        <circle cx="16" cy="114" r="1.4" class="gate__envelope-dot"/>
        <circle cx="204" cy="114" r="1.4" class="gate__envelope-dot"/>
      </svg>
      <span class="gate__seal" aria-hidden="true">
        <span class="gate__tap-ring"></span>
        <span class="gate__tap-ring gate__tap-ring--2"></span>
        <svg class="gate__seal-icon" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" class="seal__ring"/>
          <circle cx="20" cy="20" r="13" class="seal__fill"/>
          <text x="20" y="26" text-anchor="middle" class="seal__letter">L</text>
        </svg>
      </span>
      <span class="gate__envelope-label">Ver invitación</span>
    </button>
  </div>
