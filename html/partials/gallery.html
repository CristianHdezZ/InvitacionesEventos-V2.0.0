  <!-- ===================== GALERÍA ===================== -->
  <section id="galeria" class="section section--center galeria">
    <div class="section__inner" data-aos="fade-up">
      <div class="section__header">
        <span class="section__badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg></span>
        <span class="section__eyebrow">Recuerdos</span>
        <h2 class="section__title">Galería de fotos</h2>
      </div>

      <div class="swiper galeria__swiper" id="galeriaSwiper">
        <div class="swiper-wrapper" id="galeriaWrapper">
          <!-- Estas dos son las fotos reales que hay en el repo. La
               galería es editable desde el admin, así que esto es solo
               el punto de partida: al añadir más fotos se suman aquí y
               en la lista `galeria` de api/config.js. -->
          <div class="swiper-slide"><button class="galeria__item" data-full="assets/gallery/Linda02.png"><img src="assets/gallery/Linda02.png" alt="Linda en las escaleras del castillo al atardecer" loading="lazy"></button></div>
          <div class="swiper-slide"><button class="galeria__item" data-full="assets/gallery/Linda04.png"><img src="assets/gallery/Linda04.png" alt="Retrato de Linda con su corona" loading="lazy"></button></div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>

          <p class="album-regalo__hashtag">En Instagram usa el hashtag<br>

            </a>

        </div>
