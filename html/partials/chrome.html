<!-- ===================== BOTÓN DE MÚSICA =====================
     data-audio y data-music son los enganches que busca
     js/components/music.js. Sin ellos el componente no
     encontraba el botón y el clic no hacía nada.
============================================================ -->
<audio id="bgMusic" data-audio loop preload="none">
  <source src="assets/music/LaPrincesadePapa.mp3" type="audio/mpeg">
</audio>
<button id="musicToggle" data-music class="music-toggle" aria-label="Reproducir música" aria-pressed="false">
  <!-- Onda dentro del botón, recortada por el círculo: se ve la
       franja central de la figura, como una señal a través de una
       ventana redonda. El SVG es más ancho que el botón para que lo
       que cruce sea la parte alta de las crestas y no las puntas. -->
<span class="music-wave" aria-hidden="true">
  <!-- La silueta no se puede hacer con dos elipses: son dos bordes
       ondulados que se juntan en punta a los lados. Los trazados
       están generados con un seno cuya amplitud se apaga hacia los
       extremos, que es lo que produce esas puntas.

       La rosa va detrás y es la más ancha, así asoma por encima y
       por debajo de la dorada, como en la referencia. -->
  <svg class="music-wave__svg" viewBox="0 0 320 80" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <!-- Cada onda se apaga hacia sus puntas en vez de cortarse con
           un borde duro. Es lo que hace que se lean como una forma y
           no como tres recortes pegados. Los colores se ponen desde
           el CSS para que sigan la paleta. -->
      <linearGradient id="ondaFondo" x1="0" y1="0" x2="1" y2="0">
        <stop class="music-wave__stop--rosa" offset="0" stop-opacity="0"/>
        <stop class="music-wave__stop--rosa" offset=".5" stop-opacity=".9"/>
        <stop class="music-wave__stop--rosa" offset="1" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="ondaFrente" x1="0" y1="0" x2="1" y2="0">
        <stop class="music-wave__stop--oro" offset="0" stop-opacity="0"/>
        <stop class="music-wave__stop--oro" offset=".55" stop-opacity=".95"/>
        <stop class="music-wave__stop--oro" offset="1" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- Dos capas del mismo tamaño, cada una simétrica respecto a su eje
         horizontal. Comparten frecuencia pero van media vuelta
         desfasadas: donde una tiene cresta la otra tiene valle, así
         nunca se superponen. Solo convergen en las puntas, donde la
         amplitud es cero y no queda otra. -->
    <path class="music-wave__path music-wave__path--fondo" stroke-width="1" vector-effect="non-scaling-stroke" fill="url(#ondaFondo)" d="M0,40C3,39 13,36 19,34C25,32 32,29 38,28C44,27 50,27 56,27C62,27 69,29 75,30C81,31 88,34 94,35C100,36 107,37 113,36C119,35 126,32 132,29C138,26 145,23 151,20C157,17 163,14 169,13C175,12 182,13 188,14C194,16 201,19 207,22C213,25 220,30 226,32C232,35 239,36 245,37C251,38 258,37 264,36C270,36 276,34 282,34C288,34 295,33 301,34C307,35 317,39 320,40L320,40C317,41 307,45 301,46C295,47 288,46 282,46C276,46 270,45 264,44C258,44 251,42 245,43C239,44 232,46 226,48C220,51 213,55 207,58C201,61 194,65 188,66C182,68 175,68 169,67C163,66 157,63 151,60C145,57 138,54 132,51C126,48 119,45 113,44C107,43 100,44 94,45C88,46 81,49 75,50C69,51 62,53 56,53C50,53 44,53 38,52C32,51 25,48 19,46C13,44 3,41 0,40Z"/>
    <path class="music-wave__path music-wave__path--frente" stroke-width="1" vector-effect="non-scaling-stroke" fill="url(#ondaFrente)" d="M0,40C3,40 13,38 19,38C25,38 32,39 38,38C44,37 50,36 56,34C62,32 69,29 75,26C81,23 88,19 94,17C100,15 107,13 113,13C119,13 126,16 132,18C138,20 145,24 151,27C157,30 163,33 169,34C175,35 182,35 188,34C194,33 201,29 207,27C213,25 220,21 226,20C232,19 239,18 245,19C251,20 258,22 264,24C270,26 276,30 282,32C288,34 295,37 301,38C307,39 317,40 320,40L320,40C317,40 307,41 301,42C295,43 288,46 282,48C276,50 270,54 264,56C258,58 251,60 245,61C239,62 232,61 226,60C220,59 213,55 207,53C201,51 194,47 188,46C182,45 175,45 169,46C163,47 157,50 151,53C145,56 138,60 132,62C126,64 119,67 113,67C107,67 100,65 94,63C88,61 81,57 75,54C69,51 62,48 56,46C50,44 44,43 38,42C32,41 25,42 19,42C13,42 3,40 0,40Z"/>
  </svg>
</span>
  <!-- Cinco barras y no tres: con tres se lee como un icono; con
       cinco, cada una a su altura y a su ritmo, se lee como una onda
       de sonido. El CSS las mueve solo mientras suena la música. -->
  <span class="music-icon"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>
</button>
