<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#FBEAEE">

    <title>Mis XV Años · Linda Hernández</title>
    <meta name="description" content="Invitación digital a mis XV años">

    <!-- El <head> NO se puede cargar con fetch: el navegador ya
         resolvió esta parte del documento antes de que corra el
         JavaScript. html/partials/head.html se conserva como
         referencia, pero el contenido real vive aquí. -->

    <!-- ==========================================
         TIPOGRAFÍAS
    =========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Alex+Brush&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- ==========================================
         CSS (punto de entrada único: css/main.css)
    =========================================== -->

    <link rel="stylesheet" href="css/main.css">

    <!-- ==========================================
         LIBRERÍAS (CDN, sin build tools)
    =========================================== -->

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- ==========================================
         VISTA PREVIA AL COMPARTIR
         (WhatsApp, Facebook, Telegram, etc.)
         og:image y og:url deben ser URLs absolutas y públicas.
    =========================================== -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="Mis XV Años · Linda Hernández">
    <meta property="og:description" content="Con la bendición de Dios y mi familia, te invito a celebrar mis XV años el 19 de septiembre de 2026. ¡Espero contar contigo!">
    <meta property="og:image" content="https://mis-xv-linda-invitaciones.vercel.app/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://mis-xv-linda-invitaciones.vercel.app/">
    <meta property="og:locale" content="es_ES">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mis XV Años · Linda Hernández">
    <meta name="twitter:description" content="Con la bendición de Dios y mi familia, te invito a celebrar mis XV años el 19 de septiembre de 2026.">
    <meta name="twitter:image" content="https://mis-xv-linda-invitaciones.vercel.app/assets/og-image.jpg">

</head>

<body class="gate-active">

    <!-- Cada data-include se reemplaza por el contenido de su
         archivo. El div contenedor desaparece, así que el HTML
         final queda idéntico al de una sola pieza y el CSS no
         necesita cambiar. -->

    <div data-include="html/partials/gate.html"></div>
    <div data-include="html/partials/chrome.html"></div>
    <div data-include="html/partials/hero.html"></div>

    <main>
        <div data-include="html/partials/countdown.html"></div>
        <div data-include="html/partials/letter.html"></div>
        <div data-include="html/partials/timeline.html"></div>
        <div data-include="html/partials/dresscode.html"></div>
        <div data-include="html/partials/gifts.html"></div>
        <div data-include="html/partials/location.html"></div>
        <div data-include="html/partials/gallery.html"></div>
        <div data-include="html/partials/playlist.html"></div>
        <div data-include="html/partials/modal.html"></div>
        <div data-include="html/partials/rsvp.html"></div>
    </main>

    <div data-include="html/partials/footer.html"></div>

    <script src="js/include.js"></script>

</body>

</html>
